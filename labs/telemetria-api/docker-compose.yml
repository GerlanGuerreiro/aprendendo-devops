services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: telemetria
      POSTGRES_PASSWORD: telemetria
      POSTGRES_DB: telemetria
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetria"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://telemetria:telemetria@db:5432/telemetria
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
